<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · AgroPuntos</title>
  <link rel="icon" href="../assets/logo.png">
  <link rel="stylesheet" href="css/admin-variables.css">
  <link rel="stylesheet" href="css/admin-base.css">
  <script>
    (function(){var t=localStorage.getItem('agropuntos-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }

    .login-card {
      background: var(--a-card);
      border: 1px solid var(--a-border);
      border-radius: 18px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--a-shadow-lg);
      animation: fadeInUp 0.5s ease;
    }

    .login-logo {
      display: flex; align-items: center; gap: 12px;
      justify-content: center; margin-bottom: 28px;
    }
    .login-logo-box {
      width: 48px; height: 48px;
      background: var(--a-accent);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .login-logo-box img { width: 36px; height: 36px; object-fit: contain; filter: brightness(0) invert(1); }
    .login-logo-name { font-size: 22px; font-weight: 800; color: var(--a-text); }
    .login-logo-name span { color: var(--a-accent); }

    .login-title { font-size: 18px; font-weight: 700; color: var(--a-text); margin-bottom: 4px; }
    .login-sub   { font-size: 13.5px; color: var(--a-text-3); margin-bottom: 24px; }

    .login-error {
      background: rgba(192,57,43,0.12);
      border: 1px solid rgba(192,57,43,0.3);
      color: var(--a-danger);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }

    .pass-wrapper { position: relative; }
    .pass-wrapper .form-input-a { padding-right: 42px; }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--a-text-3); cursor: pointer; font-size: 16px;
    }

    .login-hint {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--a-text-3);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-box">
        <img src="../assets/logo.png" alt="AgroPuntos">
      </div>
      <span class="login-logo-name">Agro<span>Puntos</span></span>
    </div>

    <div class="login-title">Panel de Administración</div>
    <div class="login-sub">Ingresa tus credenciales para continuar</div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="form-group-a">
        <label class="form-label-a">Usuario</label>
        <input type="text" id="login-user" class="form-input-a"
               placeholder="admin" autocomplete="username" required>
      </div>
      <div class="form-group-a">
        <label class="form-label-a">Contraseña</label>
        <div class="pass-wrapper">
          <input type="password" id="login-pass" class="form-input-a"
                 placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-pass" id="toggle-pass">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-a btn-primary btn-full btn-lg" style="margin-top:8px">
        Iniciar Sesión →
      </button>
    </form>

    <div class="login-hint">Usuario: <strong>admin</strong> · Contraseña: <strong>admin123</strong></div>
  </div>

  <script src="js/admin-auth.js"></script>
  <script>document.addEventListener('DOMContentLoaded', AdminAuth.init);</script>
</body>
</html>
